<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAMERA PARTOUT</title>
  <style>
    html, body { margin: 0; min-height: 100%; }
    body { font-family: Arial, sans-serif; background: #f4f6f8; }
    .loader { min-height: 100vh; display: grid; place-items: center; color: #222; }
    .loader p { margin: 0; padding: 24px; text-align: center; }
  </style>
</head>
<body>
  <div class="loader" id="loader"><p>Loading CAMERA PARTOUT…</p></div>
  <script>
    // Camera-Partout is kept as the original source file. Load it as HTML so
    // GitHub Pages can render the app even though the source has no .html suffix.
    fetch('./Camera-Partout', { cache: 'no-store' })
      .then(function (response) {
        if (!response.ok) throw new Error('Unable to load Camera-Partout (' + response.status + ')');
        return response.text();
      })
      .then(function (html) {
        document.open();
        document.write(html);
        document.close();
      })
      .catch(function (error) {
        document.getElementById('loader').innerHTML =
          '<p>Unable to load the app. Please refresh the page.<br><small>' +
          error.message.replace(/[&<>"']/g, function (character) {
            return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character];
          }) + '</small></p>';
      });
  </script>
</body>
</html>
